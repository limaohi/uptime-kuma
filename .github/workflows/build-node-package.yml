name: Build Uptime Kuma Node Package

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Show project information
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -p "require('./package.json').version"
          node -e "console.log(JSON.stringify(require('./package.json').scripts, null, 2))"

      - name: Install all dependencies
        run: npm ci --no-audit

      - name: Build application
        shell: bash
        run: |
          set -euo pipefail

          SCRIPTS="$(node -e "console.log(Object.keys(require('./package.json').scripts || {}).join(' '))")"

          if echo "${SCRIPTS}" | grep -qw build; then
            npm run build
          elif echo "${SCRIPTS}" | grep -qw build:backend; then
            npm run build:backend
          else
            echo "No build script was found."
            npm run
            exit 1
          fi

      - name: Download distribution files
        run: npm run download-dist

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail

          test -f server/server.js
          test -d node_modules
          test -d dist

          DIST_FILE="$(find dist -type f -print -quit)"
          test -n "${DIST_FILE}"

          echo "server/server.js:"
          ls -lh server/server.js

          echo "dist size:"
          du -sh dist

          echo "First dist files:"
          find dist -maxdepth 2 -type f -print | sed -n '1,30p'

      - name: Test production entrypoint
        shell: bash
        run: |
          set +e
          timeout 30s node server/server.js
          CODE=$?
          set -e

          if [ "${CODE}" -ne 124 ]; then
            echo "Application exited unexpectedly with code: ${CODE}"
            exit "${CODE}"
          fi

          echo "Application stayed alive for 30 seconds."

      - name: Remove development dependencies
        run: npm prune --omit=dev

      - name: Verify production package
        shell: bash
        run: |
          set -euo pipefail

          test -f server/server.js
          test -d node_modules
          test -d dist
          test -n "$(find dist -type f -print -quit)"

      - name: Prepare package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="${GITHUB_SHA::7}"
          PACKAGE_NAME="uptime-kuma-${VERSION}-node${NODE_VERSION}-${SHORT_SHA}"

          rm -rf package
          mkdir -p "package/${PACKAGE_NAME}/data"

          cp -a server "package/${PACKAGE_NAME}/"
          cp -a node_modules "package/${PACKAGE_NAME}/"
          cp -a dist "package/${PACKAGE_NAME}/"
          cp -a package.json "package/${PACKAGE_NAME}/"
          cp -a package-lock.json "package/${PACKAGE_NAME}/"

          for item in src public extra frontend; do
            if [ -e "${item}" ]; then
              cp -a "${item}" "package/${PACKAGE_NAME}/"
            fi
          done

          printf '%s\n' \
            "version=${VERSION}" \
            "node_major=${NODE_VERSION}" \
            "commit=${GITHUB_SHA}" \
            "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "package/${PACKAGE_NAME}/VERSION"

          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -e' \
            'cd "$(dirname "$0")"' \
            'export NODE_ENV="${NODE_ENV:-production}"' \
            'export UPTIME_KUMA_IS_CONTAINER="${UPTIME_KUMA_IS_CONTAINER:-1}"' \
            'exec node server/server.js' \
            > "package/${PACKAGE_NAME}/start.sh"

          chmod +x "package/${PACKAGE_NAME}/start.sh"

          tar --owner=0 --group=0 --numeric-owner \
            -czf "${PACKAGE_NAME}.tar.gz" \
            -C package "${PACKAGE_NAME}"

          sha256sum "${PACKAGE_NAME}.tar.gz" \
            > "${PACKAGE_NAME}.tar.gz.sha256"

          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"

      - name: Verify archive contents
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_LIST="$(tar -tzf "${PACKAGE_NAME}.tar.gz")"

          echo "Checking server/server.js"
          echo "${ARCHIVE_LIST}" | grep -qE "/server/server\.js$"

          echo "Checking dist"
          echo "${ARCHIVE_LIST}" | grep -qE "/dist/"

          echo "Checking node_modules"
          echo "${ARCHIVE_LIST}" | grep -qE "/node_modules/"

          echo "Archive size:"
          ls -lh "${PACKAGE_NAME}.tar.gz" \
            "${PACKAGE_NAME}.tar.gz.sha256"

          echo "First archive files:"
          printf '%s\n' "${ARCHIVE_LIST}" | sed -n '1,80p'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: uptime-kuma-node-package
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256

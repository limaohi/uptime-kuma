name: Build Uptime Kuma Node Package

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check versions
        run: |
          node --version
          npm --version
          node -p "require('./package.json').version"

      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit

      - name: Download distribution files
        run: npm run download-dist

      - name: Verify application
        run: |
          test -f server/server.js
          test -f package.json
          test -d node_modules

      - name: Prepare package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=${GITHUB_SHA::7}
          PACKAGE_NAME=uptime-kuma-${VERSION}-node20-${SHORT_SHA}

          rm -rf package
          mkdir -p package/${PACKAGE_NAME}/data

          cp -a server package/${PACKAGE_NAME}/
          cp -a node_modules package/${PACKAGE_NAME}/
          cp -a package.json package/${PACKAGE_NAME}/
          cp -a package-lock.json package/${PACKAGE_NAME}/

          for item in public extra dist frontend; do
            if [ -e "${item}" ]; then
              cp -a "${item}" package/${PACKAGE_NAME}/
            fi
          done

          printf '%s\n' \
            "version=${VERSION}" \
            "node_major=20" \
            "commit=${GITHUB_SHA}" \
            "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > package/${PACKAGE_NAME}/VERSION

          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -e' \
            'cd "$(dirname "$0")"' \
            'export NODE_ENV="${NODE_ENV:-production}"' \
            'export UPTIME_KUMA_IS_CONTAINER="${UPTIME_KUMA_IS_CONTAINER:-1}"' \
            'exec node server/server.js' \
            > package/${PACKAGE_NAME}/start.sh

          chmod +x package/${PACKAGE_NAME}/start.sh

          tar --owner=0 --group=0 --numeric-owner \
            -czf ${PACKAGE_NAME}.tar.gz \
            -C package ${PACKAGE_NAME}

          sha256sum ${PACKAGE_NAME}.tar.gz > ${PACKAGE_NAME}.tar.gz.sha256
          echo PACKAGE_NAME=${PACKAGE_NAME} >> ${GITHUB_ENV}

      - name: Show package information
        run: |
          ls -lh ${PACKAGE_NAME}.tar.gz ${PACKAGE_NAME}.tar.gz.sha256
          tar -tzf ${PACKAGE_NAME}.tar.gz | head -50

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: uptime-kuma-node-package
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
